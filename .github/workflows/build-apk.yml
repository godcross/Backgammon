name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Backgammon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Backgammon-apk
          path: Backgammon.apk

      - name: Publish build log on failure
        if: failure()
        run: |
          cp build.log /tmp/build.log || echo "no log" > /tmp/build.log
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build.log
          git add -f build.log
          git commit -m "build log for ${GITHUB_SHA}"
          git push -f origin build-log
